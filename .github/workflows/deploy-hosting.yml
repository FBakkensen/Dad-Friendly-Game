name: deploy-hosting

on:
  push:
    branches: [main]

# Merges deploy in order, one at a time.
concurrency:
  group: deploy-hosting
  cancel-in-progress: false

# Least privilege (#606): the token only checks out the code. Firebase deploys with its own service account.
permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      # The backstop for local signoff (#397): a red gate on main deploys nothing.
      - name: Full gate
        run: npm run check
      - run: npm run build
        env:
          VITE_FIREBASE_API_KEY: ${{ vars.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ vars.VITE_FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_PROJECT_ID: ${{ vars.VITE_FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_APP_ID: ${{ vars.VITE_FIREBASE_APP_ID }}
      # Every deploy must ship a worker with new bytes, or open pages never see the update card (#516).
      - name: Check the service worker is stamped
        run: |
          if grep -q "^// Build: dev$" dist/sw.js || ! grep -q "^// Build: " dist/sw.js; then
            echo "dist/sw.js carries no build stamp" >&2
            exit 1
          fi
      - name: Deploy Firestore
        # github-action-hosting needs Firebase Rules Admin, Firebase Rules Firestore Service Agent, and Cloud Datastore Index Admin.
        run: |
          printf '%s' "$FIREBASE_SERVICE_ACCOUNT" > "$RUNNER_TEMP/firebase-sa.json"
          export GOOGLE_APPLICATION_CREDENTIALS="$RUNNER_TEMP/firebase-sa.json"
          npx --yes firebase-tools@latest deploy --only firestore:rules,firestore:indexes --project dad-friendly-game --non-interactive
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
      - uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          projectId: dad-friendly-game
          channelId: live
