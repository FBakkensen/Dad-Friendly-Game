name: check

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run check

  strategy-lab:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      # A missed target fails the job. The report is still posted.
      - run: npm run lab -- --ci
        env:
          LAB_STRICT: "1"
      - name: Post the strategy lab report
        if: always()
        run: |
          if [ -f reports/strategy-lab.md ]; then
            cat reports/strategy-lab.md >> "$GITHUB_STEP_SUMMARY"
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: strategy-lab
          path: |
            reports/strategy-lab.md
            reports/strategy-lab.json
          if-no-files-found: ignore
