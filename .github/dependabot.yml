# Dependabot (#605). Security updates are on in the repo settings and come
# as soon as an alert is raised. These are the routine bumps: once a month,
# minor and patch grouped into one PR per ecosystem. A major comes as its
# own PR; majors are not ignored here, because an ignore rule would also
# hold back a security update that needs one.
# A thread runs the full gate and signoff on a green bot PR and merges it
# (ship-sitting, Bot PRs).
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 2
    groups:
      npm-minor-and-patch:
        update-types: [minor, patch]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 2
    groups:
      actions-minor-and-patch:
        update-types: [minor, patch]
