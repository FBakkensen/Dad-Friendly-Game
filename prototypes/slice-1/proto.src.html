<title>Slice 1 Prototype</title>
<style>
  /* Layout: a 424px phone board scaled to the screen. A thin frame (order, piles, Next, places)
     around one full-bleed scene per place: earth for the mine, fire for the works, wood and
     blueprint for the workshop, night sky for the village. */

  @font-face { font-family: "Barlow Condensed"; font-weight: 700; src: url(__BARLOW700__) format("woff2"); }
  @font-face { font-family: "Share Tech Mono"; font-weight: 400; src: url(__MONO__) format("woff2"); }
  :root {
    color-scheme: dark;
    --page: #0b0d10; --frame: #14181d; --edge: #2b333c; --ink: #ece3cf; --quiet: #a9a492;
    --amber: #f2b441; --green: #6fd66a; --red: #e2552d; --blue: #5aa2ea; --moon: #c3ccff;
    --dark: #0d1014; --wood: #c4955d; --paper: #2f5f9a;
    --text: "Barlow Condensed", "Arial Narrow", system-ui, sans-serif;
    --mono: "Share Tech Mono", ui-monospace, Menlo, monospace;
  }
  html, body { height: 100%; margin: 0; }
  [hidden] { display: none !important; }
  body { background: var(--page); color: var(--ink); font-family: var(--text); font-weight: 600; overflow: hidden;
    touch-action: none; user-select: none; -webkit-user-select: none; -webkit-tap-highlight-color: transparent; }
  button { font: inherit; color: inherit; background: none; border: 0; padding: 0; margin: 0; text-align: left; cursor: pointer; touch-action: none; }
  button:focus-visible { outline: 2px solid var(--amber); outline-offset: -2px; }
  canvas { image-rendering: pixelated; display: block; }
  #fit { position: relative; width: 100%; height: 100%; overflow: hidden; }
  #stage { position: absolute; left: 0; top: 0; width: 424px; height: 760px; transform-origin: 0 0; background: var(--frame); overflow: hidden; font-size: 16px; line-height: 1.15; }
  .num { font-family: var(--mono); font-weight: 400; }
  .stg, #p-works .plate, .bp { display: flex; flex-direction: column; justify-content: flex-start; align-items: stretch; }
  .ico { display: inline-block; width: 16px; height: 16px; background-size: 100% 100%; image-rendering: pixelated; vertical-align: -3px; }

  /* the frame */

  #order .l2 { color: var(--quiet); font-size: 15px; margin-top: 3px; white-space: nowrap; }

  #piles { position: absolute; left: 0; right: 0; top: 54px; height: 44px; display: flex; background: #10141a; border-bottom: 2px solid var(--edge); }

  #p-works .ext { position: absolute; left: 6px; right: 6px; height: 44px; background: #170b09ee; border: 2px solid #6b3324; display: flex; align-items: center; padding: 0 10px; gap: 8px; }

  #p-workshop .tray .num { font-size: 13px; }
  #p-workshop .rack { position: absolute; right: 8px; top: 6px; font-size: 13px; color: #f1dcb8; text-align: right; line-height: 1.15; text-shadow: 0 1px 0 #000; }
  #p-workshop .job { position: absolute; left: 30px; right: 30px; text-align: center; color: #dff3ea; }
  #p-workshop .job .a { font-size: 22px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; }
  #p-workshop .job .b { font-size: 15px; color: #a9c9bd; }
  #p-workshop .time { position: absolute; font-size: 30px; color: #fff; text-shadow: 0 2px 0 #000; }
  #p-workshop .fit { position: absolute; left: 30px; width: 170px; height: 56px; text-align: center; font-size: 22px; font-weight: 700; background: #23402a; border: 2px solid var(--green); color: #d9ffd2; }
  .bp { position: absolute; width: 128px; height: 160px; padding: 60px 8px 0; color: #eaf3ff; z-index: 2; }

  .bp .b { font-size: 12.5px; color: #cfe2ff; margin-top: 3px; line-height: 1.15; }
  .bp .c { font-size: 12.5px; margin-top: 3px; line-height: 1.2; }
  .bp .c span { white-space: nowrap; }
  .bp .c .no { color: #ffb19c; }
  .bp .s { position: absolute; right: 8px; top: 8px; font-size: 14px; color: #cfe2ff; }

  /* the village: night sky and a road */
  #p-village .tag { position: absolute; text-align: center; font-size: 13px; letter-spacing: .08em; text-transform: uppercase; color: #f4ead2; text-shadow: 0 1px 0 #000, 0 0 4px #000; line-height: 1.05; }
  #p-village .tag small { display: block; letter-spacing: 0; text-transform: none; color: var(--moon); font-size: 12px; }
  #p-village .plot { position: absolute; }
  #p-village .bub { position: absolute; left: 30px; right: 30px; padding: 8px 10px; background: #0a1030ee; border: 2px solid var(--moon); font-size: 17px; text-align: center; pointer-events: none; opacity: 0; transition: opacity .2s; }

</style>

<script>
"use strict";
/* A throwaway prototype of slice 1's four places. Fake numbers, real taps. Not the game's code. */
const IMGS = __IMG__;
const im = {};
const $ = (s, r = document) => r.querySelector(s);
const el = (tag, cls, parent, html) => { const e = document.createElement(tag); if (cls) e.className = cls; if (html != null) e.innerHTML = html; if (parent) parent.appendChild(e); return e; };
const W = 212, SURF = 40, LH = 74;
const PLACES = ["mine", "works", "workshop", "village"];
const ACC = { mine: "#f2b441", works: "#e2552d", workshop: "#5aa2ea", village: "#c3ccff" };
const GN = { stones: "stone", bricks: "brick", cut: "cut stone", clay: "clay", iron: "iron" };
const GC = { stones: "Stone", bricks: "Brick", cut: "Cut stone" };
const PLACE_N = { mine: "Mine", works: "Refinery", workshop: "Factory", village: "City" };
const STG = {
  face: { n: "Drilling", mach: "Drill", icon: "mach-drill", base: 900, per: 600, price: 40000, good: "stones", gear: "props", start: 3 },
  haul: { n: "Haulage", mach: "Locomotive", icon: "mach-train", base: 500, per: 800, price: 5000, good: "cut", gear: "rails", start: 3 },
  lift: { n: "Hoisting", mach: "Hoist", icon: "mach-hoist", base: 1000, per: 1200, price: 60000, good: "stones", start: 2 },
};
const REC = {
  rails: { n: "Iron rails", cost: { stones: 20000, iron: 4 }, s: 30, max: 2, does: "Haulage capacity +15%", verb: "Install" },
  props: { n: "Pit props", cost: { stones: 10000, clay: 6, iron: 4 }, s: 30, max: 1, does: "Drilling capacity +15%", verb: "Install" },
  charge: { n: "Blasting charge", cost: { stones: 5000, clay: 5 }, s: 20, does: "Throughput ×2 for 60 s", verb: "Detonate" },
};
const BLD = [
  { id: "beacon", n: "The Light Tower", gives: "Night shift output 45%, up from 30%.", steps: [] },
  { id: "store", n: "The Warehouse", gives: "Stockyard capacity ×2.", steps: [{ stones: 30000 }, { stones: 60000, bricks: 20000 }, { bricks: 40000 }] },
  { id: "forge", n: "The Foundry", gives: "Unlocks the winding engine, for hoisting.", steps: [{ bricks: 30000, cut: 10000 }, { bricks: 50000, cut: 30000 }, { bricks: 60000, cut: 60000 }] },
];
const STEPN = ["Foundation", "Structure", "Roof"];
const fresh = () => ({
  v: 4, stones: 46000, bricks: 12000, cut: 3000, yard: 0, m: { face: 3, haul: 3, lift: 2, great: 0 }, gangs: [2, 2], kilns: 4, saws: 2,
  clay: 6, iron: 9, bench: null, gear: { rails: 0, props: 0 }, charge: 0,
  b: { beacon: { step: 3, given: {} }, store: { step: 1, given: { stones: 22000, bricks: 3000 } }, forge: { step: 0, given: {} } },
  intro: false, place: 0, seen: 0,
});
let S = fresh();
try { const raw = localStorage.getItem("slice1-proto"); if (raw) { const o = JSON.parse(raw); if (o && o.v === 4) S = o; } } catch (e) { /* plays without it */ }
const GONE = S.seen ? (Date.now() - S.seen) / 1000 : 0; // how long he was away, read before anything saves
const save = () => { S.seen = Date.now(); try { localStorage.setItem("slice1-proto", JSON.stringify(S)); } catch (e) { /* plays without it */ } };

/* ---------- numbers ---------- */
const fmt = (n) => { n = Math.floor(n); if (n >= 1e6) return (n / 1e6).toFixed(2).replace(/\.?0+$/, "") + "M"; if (n >= 1e4) return (n / 1e3).toFixed(1).replace(/\.0$/, "") + "K"; return n.toLocaleString("en-US"); };
const rate = (n) => Math.round(n).toLocaleString("en-US") + "/s";
const nice = (n) => { const p = Math.pow(10, Math.max(0, Math.floor(Math.log10(n)) - 1)); return Math.round(n / p) * p; };
const forgeUp = () => S.b.forge.step >= 3;
const stageBuy = (k) => k === "lift" && forgeUp()
  ? { mach: "Winding engine", short: "Engine", good: "cut", price: nice(30000 * Math.pow(1.25, S.m.great)), key: "great", per: 3000 }
  : { mach: STG[k].mach, short: STG[k].mach, good: STG[k].good, price: nice(STG[k].price * Math.pow(1.25, S.m[k] - STG[k].start)), key: k, per: STG[k].per };
const kilnPrice = () => nice(20000 * Math.pow(1.2, S.kilns - 4));
const sawPrice = () => nice(12000 * Math.pow(1.2, S.saws - 2));
const yardPrice = () => 30000 * Math.pow(3, S.yard);
const caps = () => { const k = Math.pow(3, S.yard) * (S.b.store.step >= 3 ? 2 : 1); return { stones: 400000 * k, bricks: 80000 * k, cut: 40000 * k }; };
const lc = (t) => t.charAt(0).toLowerCase() + t.slice(1);
const low = (n) => n.replace(/^The /, "the ");
const inHand = () => BLD.find((b) => S.b[b.id].step < 3);
function flows() {
  const f = {}; let narrow = "face";
  for (const k in STG) { f[k] = (STG[k].base + STG[k].per * S.m[k] + (k === "lift" ? 3000 * S.m.great : 0)) * (1 + 0.15 * (STG[k].gear ? S.gear[STG[k].gear] : 0)); if (f[k] < f[narrow]) narrow = k; }
  const line = f[narrow] * (S.charge > 0 ? 2 : 1), cap = caps();
  const rock = [line * S.gangs[0] / 4, line * S.gangs[1] / 4];
  const mk = [S.kilns * 100, S.saws * 120];

  const st = $("#stage"); st.style.height = H + "px"; stageX = Math.max(0, (vw - 424 * scale) / 2); stageY = Math.max(0, (vh - H * scale) / 2); st.style.transform = `translate(${stageX}px,${stageY}px) scale(${scale})`;
  hA = Math.floor((H - 216) / 2);
  BG.mine = mineBG(hA); BG.works = worksBG(hA); BG.workshop = shopBG(hA); BG.village = villageBG(hA);
  for (const p of PLACES) { const cv = $("#p-" + p + " canvas"); cv.width = W; cv.height = hA; cv.style.height = hA * 2 + "px"; CTX[p] = cv.getContext("2d"); CTX[p].imageSmoothingEnabled = false; }
  mineDOM($("#p-mine .ov")); worksDOM($("#p-works .ov"), hA); shopDOM($("#p-workshop .ov"), hA); villageDOM($("#p-village .ov"), hA);
  go(S.place); ui();
}
function swipes() {
  const sc = $("#scenes"); let s = null;
  sc.addEventListener("pointerdown", (e) => { s = e.target.closest("button") ? null : pt(e); });
  sc.addEventListener("pointerup", (e) => { if (!s) return; const p = pt(e), dx = p.x - s.x, dy = p.y - s.y; s = null; if (Math.abs(dx) > 50 && Math.abs(dx) > Math.abs(dy) * 1.5) go(Math.max(0, Math.min(3, S.place + (dx < 0 ? 1 : -1)))); });
}
function frame() {

  $("#piles").innerHTML = ["stones", "bricks", "cut"].map((g) => `<div class="pile" id="pile-${g}">${ico(g)}<span class="v num"></span><span class="of"></span><div class="bar"><i></i></div></div>`).join("");
  $("#next").innerHTML = `<div class="what"><div class="k"></div><div class="t"></div></div><div class="n"><b></b>ready</div>`; tap($("#next"), () => { const a = actions()[0]; if (a) { go(a.p); const s = a.sel && $(a.sel); if (s) { s.classList.remove("pulse"); void s.offsetWidth; s.classList.add("pulse"); } } });
  PLACES.forEach((p, i) => { const b = el("button", "", $("#tabs"), `${ico(p)}<span>${PLACE_N[p]}</span><i class="lamp"></i>`); b.style.setProperty("--acc", ACC[p]); tap(b, () => go(i)); });

}
function ui() {
  const F = flows(), h = inHand(), o = $("#order");
  if (h) { const st = S.b[h.id], need = h.steps[st.step]; o.querySelector(".name").textContent = h.n; o.querySelector(".step").textContent = STEPN[st.step]; o.querySelectorAll(".pips i").forEach((p, i) => { p.className = i < st.step ? "done" : i === st.step ? "now" : ""; }); o.querySelector(".l2").innerHTML = "Requires " + Object.keys(need).map((g) => `<b>${GC[g]}</b> <span class="num">${fmt(st.given[g] || 0)} of ${fmt(need[g])}</span>`).join(" &nbsp; "); }
  else { o.querySelector(".name").textContent = "Phase 1 complete"; o.querySelector(".step").textContent = ""; o.querySelectorAll(".pips i").forEach((p) => { p.className = "done"; }); o.querySelector(".l2").textContent = "The road to Mars goes on."; }
  for (const g of ["stones", "bricks", "cut"]) { const p = $("#pile-" + g); p.querySelector(".v").textContent = fmt(S[g]); p.querySelector(".of").textContent = F.full[g] ? "full" : "of " + fmt(F.cap[g]); p.querySelector(".bar i").style.width = Math.min(100, (100 * S[g]) / F.cap[g]) + "%"; p.classList.toggle("full", F.full[g]); }
  const a = actions(), n = $("#next"); n.classList.toggle("go", a.length > 0);
  n.querySelector(".k").textContent = a.length ? "Next · " + PLACE_N[PLACES[a[0].p]] : "Next"; n.querySelector(".t").textContent = a.length ? a[0].t : "Nothing affordable yet. Production is running."; n.querySelector(".n b").textContent = a.length;
  document.querySelectorAll("#tabs button").forEach((b, i) => { const l = b.querySelector(".lamp"); l.className = "lamp" + (a.some((x) => x.p === i) ? " green" : i === 2 && S.bench ? " amber" : ""); });
  mineUI(F); worksUI(F); shopUI(); villageUI();
}
let last = 0, uiT = 0, saveT = 0;
function loop(ms) {
  const t = ms / 1000, dt = Math.min(0.25, t - last || 0); last = t;
  if ($("#card").hidden) tick(dt);
  const F = flows(), p = PLACES[S.place], c = CTX[p]; c.drawImage(BG[p], 0, 0);
  if (p === "mine") mineDraw(c, hA, t, F); else if (p === "works") worksDraw(c, hA, t, F); else if (p === "workshop") shopDraw(c, hA, t); else villageDraw(c, hA, t);
  if (t - uiT > 0.2) { uiT = t; ui(); } if (t - saveT > 3) { saveT = t; save(); }

async function boot() {

  requestAnimationFrame(loop);
}
boot();
