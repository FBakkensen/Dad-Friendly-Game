<title>Slice 1 Prototype</title>
<style>
  /* Layout: a 424px phone board scaled to the screen. A thin frame (order, piles, Next, places)
     around one full-bleed scene per place: earth for the mine, fire for the works, wood and
     blueprint for the workshop, night sky for the village. */
  @font-face { font-family: "Barlow Condensed"; font-weight: 600; src: url(__BARLOW600__) format("woff2"); }
  @font-face { font-family: "Barlow Condensed"; font-weight: 700; src: url(__BARLOW700__) format("woff2"); }
  @font-face { font-family: "Share Tech Mono"; font-weight: 400; src: url(__MONO__) format("woff2"); }
  :root {
    color-scheme: dark;
    --page: #0b0d10; --frame: #14181d; --edge: #2b333c; --ink: #ece3cf; --quiet: #a9a492;
    --amber: #f2b441; --green: #6fd66a; --red: #e2552d; --blue: #5aa2ea; --moon: #c3ccff;
    --dark: #0d1014; --wood: #c4955d; --paper: #2f5f9a;
    --text: "Barlow Condensed", "Arial Narrow", system-ui, sans-serif;
    --mono: "Share Tech Mono", ui-monospace, Menlo, monospace;
  }
  html, body { height: 100%; margin: 0; }
  [hidden] { display: none !important; }
  body { background: var(--page); color: var(--ink); font-family: var(--text); font-weight: 600; overflow: hidden;
    touch-action: none; user-select: none; -webkit-user-select: none; -webkit-tap-highlight-color: transparent; }
  button { font: inherit; color: inherit; background: none; border: 0; padding: 0; margin: 0; text-align: left; cursor: pointer; touch-action: none; }
  button:focus-visible { outline: 2px solid var(--amber); outline-offset: -2px; }
  canvas { image-rendering: pixelated; display: block; }
  #fit { position: relative; width: 100%; height: 100%; overflow: hidden; }
  #stage { position: absolute; left: 0; top: 0; width: 424px; height: 760px; transform-origin: 0 0; background: var(--frame); overflow: hidden; font-size: 16px; line-height: 1.15; }
  .num { font-family: var(--mono); font-weight: 400; }
  #p-works .plate, .bp { display: flex; flex-direction: column; justify-content: flex-start; align-items: stretch; }
  .ico { display: inline-block; width: 16px; height: 16px; background-size: 100% 100%; image-rendering: pixelated; vertical-align: -3px; }
  .ico.big { width: 32px; height: 32px; }

  /* the frame */
  #order { position: absolute; left: 0; right: 0; top: 0; height: 54px; padding: 6px 10px 0 12px; background: var(--dark); border-bottom: 2px solid var(--edge); width: 100%; }
  #order .l1 { display: flex; align-items: baseline; gap: 8px; }
  #order .name { font-weight: 700; font-size: 20px; letter-spacing: .04em; text-transform: uppercase; }
  #order .step { color: var(--amber); font-size: 17px; }
  #order .pips { margin-left: auto; display: flex; gap: 4px; align-self: center; }
  #order .pips i { width: 22px; height: 7px; background: #2a3138; }
  #order .pips i.done { background: var(--green); }
  #order .pips i.now { background: var(--amber); }
  #order .l2 { color: var(--quiet); font-size: 15px; margin-top: 3px; white-space: nowrap; }
  #order .l2 b { color: var(--ink); font-weight: 600; }
  #piles { position: absolute; left: 0; right: 0; top: 54px; height: 44px; display: flex; background: #10141a; border-bottom: 2px solid var(--edge); }
  #piles .pile { flex: 1; min-width: 0; overflow: hidden; position: relative; padding: 5px 0 0 8px; border-right: 2px solid var(--edge); white-space: nowrap; }
  #piles .pile:last-child { border-right: 0; }
  #piles .v { font-size: 18px; margin-left: 4px; }
  #piles .of { font-size: 12px; color: var(--quiet); margin-left: 4px; }
  #piles .bar { position: absolute; left: 8px; right: 8px; bottom: 5px; height: 4px; background: #262d35; }
  #piles .bar i { display: block; height: 100%; width: 0; background: #8f9aa5; }
  #piles .pile.full .bar i { background: var(--red); }
  #piles .pile.full .of { color: var(--red); }
  #scenes { position: absolute; left: 0; right: 0; top: 98px; bottom: 118px; overflow: hidden; background: #000; }
  .place { position: absolute; inset: 0; transition: transform .26s ease-out; overflow: hidden; }
  .place canvas { position: absolute; left: 0; top: 0; width: 424px; }
  .ov { position: absolute; inset: 0; }
  #next { position: absolute; left: 6px; right: 6px; bottom: 66px; height: 48px; padding: 3px 10px; background: var(--dark); border: 2px solid var(--edge); display: flex; align-items: center; gap: 10px; }
  #next.go { border-color: var(--green); }
  #next .what { flex: 1; min-width: 0; }
  #next .k { font-size: 12px; letter-spacing: .12em; color: var(--amber); text-transform: uppercase; }
  #next .t { font-size: 18px; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #next .n { text-align: center; color: var(--green); font-size: 12px; line-height: 1; }
  #next .n b { display: block; font-family: var(--mono); font-weight: 400; font-size: 22px; }
  #tabs { position: absolute; left: 0; right: 0; bottom: 0; height: 62px; display: flex; gap: 4px; padding: 0 6px 6px; }
  #tabs button { flex: 1; position: relative; background: #1a2027; border: 2px solid var(--edge); border-top-width: 4px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 1px; font-size: 14px; letter-spacing: .08em; text-transform: uppercase; color: var(--quiet); }
  #tabs button .ico { width: 24px; height: 24px; opacity: .75; }
  #tabs button.on { color: var(--ink); background: #232b33; border-color: var(--acc); }
  #tabs button.on .ico { opacity: 1; }
  .lamp { position: absolute; right: 5px; top: 4px; width: 10px; height: 10px; border-radius: 50%; background: #2a3138; box-shadow: inset 0 0 0 2px #11151a; }
  .lamp.green { background: var(--green); box-shadow: 0 0 6px var(--green); }
  .lamp.amber { background: var(--amber); box-shadow: 0 0 6px var(--amber); }
  #say { position: absolute; left: 20px; right: 20px; bottom: 292px; padding: 8px 12px; background: #000c; border: 2px solid var(--amber); font-size: 17px; text-align: center; pointer-events: none; opacity: 0; transition: opacity .2s; z-index: 10; }
  #say.on { opacity: 1; }
  #card { position: absolute; inset: 0; background: #000b; display: flex; align-items: center; justify-content: center; z-index: 9; }
  #card .box { width: 344px; background: #171c22; border: 2px solid var(--amber); padding: 18px 18px 16px; }
  #card h2 { margin: 0 0 8px; font-size: 26px; font-weight: 700; letter-spacing: .04em; text-transform: uppercase; }
  #card p { margin: 0 0 10px; font-size: 18px; color: var(--ink); }
  #card p.q { color: #c9c4b4; font-size: 16px; }
  #card p em { font-style: normal; color: var(--amber); }
  #card p b { font-family: var(--mono); font-weight: 400; color: #fff; }
  #card .night { display: block; height: 16px; background: #0b1030; border: 2px solid var(--moon); }
  #card .night i { display: block; height: 100%; background: var(--amber); }
  #card .nl { display: flex; justify-content: space-between; font-size: 14px; margin-top: 3px; }
  #card .nl span:first-child { color: var(--amber); }
  #card .nl span:last-child { color: var(--moon); }
  #card .marks { display: flex; flex-wrap: wrap; gap: 4px 12px; font-size: 14px; }
  #card .row { display: flex; gap: 8px; margin-top: 14px; }
  #card .row + .row { margin-top: 8px; }
  #card .row + .row button { height: 40px; font-size: 17px; }
  #card .row button { flex: 1; height: 52px; text-align: center; font-size: 20px; font-weight: 700; background: #23402a; border: 2px solid var(--green); color: #d9ffd2; }
  #card .row button.alt { background: #22282f; border-color: var(--edge); color: var(--quiet); }
  .float { position: absolute; font-family: var(--mono); font-size: 18px; color: #ffe08a; pointer-events: none; animation: rise .8s ease-out forwards; text-shadow: 0 2px 0 #000; z-index: 4; }
  @keyframes rise { to { transform: translateY(-40px); opacity: 0; } }
  .pulse { animation: pulse .5s 4; }
  @keyframes pulse { 50% { box-shadow: 0 0 0 5px var(--green), 0 0 18px 6px var(--green); } }
  /* a stepper: take a worker off a job, put a free worker on it */
  .st { flex: none; width: 34px; height: 32px; background: #22282f; color: var(--ink); text-align: center; font-size: 22px; font-weight: 700; line-height: 28px; }
  #piles .wk { flex: none; width: 132px; display: flex; align-items: center; gap: 2px; padding-right: 3px; }
  #wfb { position: relative; flex: 1; align-self: stretch; padding: 3px 0 0 6px; white-space: nowrap; }
  #wfb .ico { width: 20px; height: 20px; vertical-align: -12px; }
  #wfb .fr { position: absolute; left: 34px; bottom: 3px; font-size: 12px; line-height: 1; color: var(--quiet); }
  #wfb .fr.has { color: var(--green); }
  #hire { flex: none; width: 64px; height: 38px; background: #22282f; color: var(--quiet); text-align: center; font-size: 14px; font-weight: 700; line-height: 1.15; white-space: nowrap; }
  #hire small { display: block; font-weight: 600; font-size: 12px; line-height: 1.1; }
  #card .wf { padding: 14px 16px; }
  #card .wf .wh { display: flex; align-items: center; gap: 8px; font-size: 17px; margin-bottom: 4px; }
  #card .wf .wh span { flex: 1; }
  #card .wf .wh b { font-family: var(--mono); font-weight: 400; font-size: 20px; color: #fff; }
  #card .wf .wh button { height: 40px; padding: 0 12px; background: #22282f; color: var(--quiet); font-size: 16px; font-weight: 700; text-align: center; white-space: nowrap; }
  #card .wf h3 { margin: 8px 0 2px; font-size: 13px; letter-spacing: .12em; text-transform: uppercase; color: var(--amber); font-weight: 600; }
  #card .wf .wr { display: flex; align-items: center; gap: 4px; height: 42px; border-top: 1px solid #2b333c; }
  #card .wf .wr .nm { width: 84px; font-size: 18px; font-weight: 700; }
  #card .wf .wr .d { flex: 1; min-width: 0; font-size: 13px; line-height: 1.1; color: var(--quiet); }
  #card .wf .wr b { width: 34px; text-align: center; font-size: 20px; font-weight: 400; color: #fff; }
  #card .wf .wr .st { width: 44px; height: 36px; line-height: 32px; }

  /* the mine: earth and lamplight */
  #p-mine .lv { position: absolute; left: 78px; right: 6px; height: 56px; padding: 4px 8px; background: #0009; }
  #p-mine .lv .a { display: flex; align-items: baseline; gap: 8px; }
  #p-mine .lv .nm { font-size: 21px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; }
  #p-mine .lv .rt { font-size: 18px; margin-left: auto; color: #ffd98a; }
  #p-mine .lv .b { font-size: 15px; color: #d9cdb4; margin-top: 2px; white-space: nowrap; }
  #p-mine .lv .b em { font-style: normal; color: var(--amber); }
  #p-mine .lv.split { padding-right: 86px; }
  #p-mine .lv .cs { position: absolute; right: 4px; top: 6px; display: flex; gap: 3px; }
  #p-mine .lv .cs .st { width: 36px; height: 44px; line-height: 40px; }
  #p-mine .deep { position: absolute; left: 10px; right: 10px; color: #8d93b8; font-size: 15px; text-align: center; }
  #line { position: absolute; left: 6px; right: 6px; bottom: 4px; display: flex; flex-direction: column; gap: 2px; }
  #line .lh { display: flex; gap: 2px; height: 36px; }
  #line .lh .k { flex: 1; min-width: 0; height: 36px; background: #14181dee; box-shadow: inset 0 0 0 2px #3b4450; color: var(--quiet); text-align: center; font-size: 14px; font-weight: 700; line-height: 1.15; white-space: nowrap; }
  #line .lh .k small { display: block; font-weight: 600; font-size: 12.5px; line-height: 1.1; }
  .stg { box-sizing: border-box; height: 38px; background: #000c; border: 2px solid #3b4450; display: flex; align-items: center; padding: 0 2px 0 6px; gap: 3px; }
  .stg .i { position: relative; flex: 1; min-width: 0; align-self: stretch; display: flex; flex-direction: column; justify-content: center; padding: 0 4px 0 0; }
  .stg .h, .stg .mk { position: relative; z-index: 1; }
  .stg .h { display: flex; align-items: baseline; gap: 4px; font-size: 15px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; line-height: 1.05; }
  .stg .h .nm { width: 78px; }
  .stg .h .r { font-size: 13px; font-weight: 600; letter-spacing: 0; text-transform: none; color: var(--quiet); }
  .stg .h .r b { font-family: var(--mono); font-weight: 400; font-size: 14px; color: #ffd98a; }
  .stg .h .r i { font-family: var(--mono); font-style: normal; font-weight: 400; font-size: 14px; color: #e3e9ef; }
  .stg .mk { font-size: 13px; line-height: 1.05; white-space: nowrap; color: var(--quiet); margin-top: 1px; overflow: hidden; }
  .stg .bar { position: absolute; left: -4px; right: 2px; top: 2px; bottom: 2px; }
  .stg .bar u { position: absolute; left: 0; top: 0; height: 100%; background: #ffffff12; }
  .stg .bar u + u { background: #ffd98a30; box-shadow: inset -1px 0 0 #ffd98a88; }
  .stg .n { flex: none; width: 44px; display: flex; flex-direction: column; align-items: center; line-height: 1; }
  .stg .n b { font-size: 17px; font-weight: 400; color: #fff; }
  .stg .n small { font-size: 10.5px; letter-spacing: .04em; color: var(--quiet); margin-top: 1px; }
  .stg .st { width: 34px; height: 30px; line-height: 26px; }
  .stg .mm { color: #e3e9ef; }
  .stg .mk .bh { color: #8cc4ff; }
  .stg .mk.sm { font-size: 12px; letter-spacing: -.02em; }
  #p-mine .zl { position: absolute; font-size: 11px; letter-spacing: .1em; text-transform: uppercase; color: #cfc4ad; text-shadow: 0 1px 0 #000; }
  #sink { position: absolute; left: 6px; right: 6px; height: 60px; background: #000b; border: 2px solid #3b4450; display: flex; align-items: center; padding: 0 8px 0 10px; gap: 8px; }
  #sink .t { flex: 1; font-size: 18px; font-weight: 700; line-height: 1; letter-spacing: .03em; }
  #sink .t small { display: block; font-size: 13px; font-weight: 600; letter-spacing: 0; color: var(--quiet); margin-top: 4px; }
  #sink .p { padding: 0 8px; height: 36px; line-height: 36px; background: #22282f; color: var(--quiet); font-size: 14px; white-space: nowrap; }
  .can { background: #23402a !important; color: #d9ffd2 !important; box-shadow: inset 0 0 0 2px var(--green); }

  /* the works: brick and fire */
  #p-works .in { position: absolute; top: 2px; width: 150px; font-size: 16px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; color: #ffd9c2; text-shadow: 0 2px 0 #000; }
  #p-works .in .num { color: #fff; font-size: 16px; }
  #p-works .mach { position: absolute; width: 140px; height: 132px; }
  #p-works .plate { position: absolute; box-sizing: border-box; width: 180px; height: 110px; background: #170b09ee; border: 2px solid #6b3324; padding: 3px 6px; }
  #p-works .plate .a { font-size: 17px; font-weight: 700; letter-spacing: .04em; white-space: nowrap; }
  #p-works .plate .b { font-size: 13px; color: #e6b9a4; white-space: nowrap; }
  #p-works .plate .p { position: absolute; left: 3px; right: 3px; bottom: 3px; height: 22px; background: #2a1814; color: #c7a393; font-size: 14px; text-align: center; line-height: 22px; white-space: nowrap; }
  #p-works .plate .w { display: flex; align-items: center; gap: 3px; margin-top: 3px; font-size: 14px; color: #f3d6c8; white-space: nowrap; }
  #p-works .plate .w span { flex: 1; text-align: center; }
  #p-works .plate .w .st { height: 28px; line-height: 24px; background: #2a1814; }
  #p-works .mid { position: absolute; left: 164px; width: 96px; text-align: center; font-size: 13px; color: #d7d2c8; background: #170b09dd; border: 2px solid #4a4038; padding: 2px 0; line-height: 1.1; }
  #p-works .bay { position: absolute; width: 132px; text-align: center; font-size: 13px; letter-spacing: .06em; color: #e9d9c8; text-shadow: 0 1px 0 #000; line-height: 1.1; }
  #p-works .bay .num { display: block; font-size: 13px; color: #fff; letter-spacing: 0; }
  #p-works .bay.full .num { color: #ff8d6a; }
  #p-works .ext { position: absolute; left: 6px; right: 6px; height: 44px; background: #170b09ee; border: 2px solid #6b3324; display: flex; align-items: center; padding: 0 10px; gap: 8px; }
  #p-works .ext .t { flex: 1; font-size: 16px; line-height: 1; }
  #p-works .ext .t small { display: block; font-size: 12px; color: #e6b9a4; margin-top: 2px; }
  #p-works .ext .p { padding: 0 10px; height: 30px; line-height: 30px; background: #2a1814; color: #c7a393; font-size: 15px; white-space: nowrap; }

  #p-works .lock { position: absolute; right: 0; top: 0; width: 160px; background: #0b0605e0; border-left: 2px solid #4a4038; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; font-size: 17px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; color: #c7a393; }
  #p-works .lock small { display: block; font-size: 13px; font-weight: 600; text-transform: none; letter-spacing: 0; padding: 4px 16px 0; }

  /* the workshop: wood and blueprint */
  #p-workshop .tray { position: absolute; width: 190px; white-space: nowrap; font-size: 13px; color: #f1dcb8; text-align: center; font-weight: 700; letter-spacing: .04em; }
  #p-workshop .tray .num { font-size: 13px; }
  #p-workshop .rack { position: absolute; right: 8px; top: 6px; font-size: 13px; color: #f1dcb8; text-align: right; line-height: 1.15; text-shadow: 0 1px 0 #000; }
  #p-workshop .job { position: absolute; left: 30px; right: 30px; text-align: center; color: #dff3ea; }
  #p-workshop .job .a { font-size: 22px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; }
  #p-workshop .job .b { font-size: 15px; color: #a9c9bd; }
  #p-workshop .time { position: absolute; font-size: 30px; color: #fff; text-shadow: 0 2px 0 #000; }
  #p-workshop .fit { position: absolute; left: 30px; width: 170px; height: 56px; text-align: center; font-size: 22px; font-weight: 700; background: #23402a; border: 2px solid var(--green); color: #d9ffd2; }
  .bp { position: absolute; width: 128px; height: 160px; padding: 60px 8px 0; color: #eaf3ff; z-index: 2; }
  .bp .a { font-size: 17px; font-weight: 700; letter-spacing: .03em; line-height: 1; }
  .bp .b { font-size: 12.5px; color: #cfe2ff; margin-top: 3px; line-height: 1.15; }
  .bp .c { font-size: 12.5px; margin-top: 3px; line-height: 1.2; }
  .bp .c span { white-space: nowrap; }
  .bp .c .no { color: #ffb19c; }
  .bp .s { position: absolute; right: 8px; top: 8px; font-size: 14px; color: #cfe2ff; }
  .bp.off { opacity: .62; }
  .bp.drag { z-index: 7; transition: none; filter: drop-shadow(0 8px 0 #0007); }
  .bp.back { transition: transform .2s; }

  /* the village: night sky and a road */
  #p-village .tag { position: absolute; text-align: center; font-size: 13px; letter-spacing: .08em; text-transform: uppercase; color: #f4ead2; text-shadow: 0 1px 0 #000, 0 0 4px #000; line-height: 1.05; }
  #p-village .tag small { display: block; letter-spacing: 0; text-transform: none; color: var(--moon); font-size: 12px; }
  #p-village .plot { position: absolute; }
  #p-village .bub { position: absolute; left: 30px; right: 30px; padding: 8px 10px; background: #0a1030ee; border: 2px solid var(--moon); font-size: 17px; text-align: center; pointer-events: none; opacity: 0; transition: opacity .2s; }
  #p-village .bub.on { opacity: 1; }
  #board { position: absolute; left: 6px; right: 6px; background: #3b2a1c; border: 2px solid #7a5a36; box-shadow: inset 0 0 0 2px #2a1d12; padding: 5px 9px; }
  #board .h { display: flex; align-items: baseline; gap: 8px; }
  #board .h b { font-size: 19px; font-weight: 700; letter-spacing: .05em; text-transform: uppercase; }
  #board .h span { font-size: 15px; color: #cdb48a; }
  #board .h span.now { color: var(--amber); }
  #board .h span.ok { color: var(--green); }
  #board .g { display: flex; align-items: center; gap: 6px; height: 42px; margin-top: 4px; }
  #board .g .w { flex: 1; min-width: 0; }
  #board .g .w div { font-size: 15px; white-space: nowrap; }
  #board .g .w i { display: block; height: 5px; background: #20160e; margin-top: 3px; }
  #board .g .w i u { display: block; height: 100%; background: var(--amber); }
  #board .g button { width: 128px; height: 40px; background: #2a1d12; color: #a89674; text-align: center; font-size: 17px; font-weight: 700; line-height: 1; }
  #board .g button small { display: block; font-family: var(--mono); font-weight: 400; font-size: 13px; }
  #board .f { font-size: 14px; color: #e3d2b0; margin-top: 4px; }
  #board .body { display: flex; gap: 6px; align-items: stretch; }
  #board .gs { flex: 1; min-width: 0; }
  #ord { width: 140px; min-height: 70px; margin-top: 4px; background: #2a1d12; color: #a89674; text-align: center; font-size: 18px; font-weight: 700; line-height: 1.05; }
  #ord small { display: block; font-family: var(--mono); font-weight: 400; font-size: 12px; margin-top: 2px; white-space: nowrap; }
  #ord small:empty { display: none; }
  #ord small + small { font-family: var(--text); font-weight: 600; font-size: 13px; }
  #ord small + small + small { color: var(--quiet); }
  #ord.run { box-shadow: inset 0 0 0 2px var(--amber); color: var(--amber); }
  #fleet { position: absolute; left: 6px; right: 6px; top: 6px; background: #0a1030e6; border: 2px solid #3a4590; padding: 4px 6px 5px; }
  #fleet .a { display: flex; align-items: baseline; gap: 8px; font-size: 15px; color: var(--moon); white-space: nowrap; }

function stageBuy(k) {

const worksOpen = () => S.b.beacon.step >= 3; // the Light Tower opens the refinery and the stockyard
const avail = (i) => [true, worksOpen(), S.shaft, true][i];
const kilnPrice = () => nice(10000 * Math.pow(1.2, S.kilns));
const sawPrice = () => nice(8000 * Math.pow(1.2, S.saws));
const yardPrice = () => 30000 * Math.pow(3, S.yard);

const lc = (t) => t.charAt(0).toLowerCase() + t.slice(1);
const low = (n) => n.replace(/^The /, "the ");
const inHand = () => BLD.find((b) => S.b[b.id].step < 3);
function flows() {
  const sf = staffing(), f = sf.f;

const jobP = (need, given) => { let a = 0, b = 0; for (const g in need) { const w = WGT[g] || 1; a += Math.min(need[g], given[g] || 0) * w; b += need[g] * w; } return a / b; };

function events(ev) {

/* ---------- time away: the night shift, until the stockyard is full ---------- */

/* ---------- what he can do ---------- */
const canPay = (cost) => Object.keys(cost).every((g) => Math.floor(S[g]) >= cost[g]);

function sinkShaft() {

}

/* ---------- the workforce: every job, how many are on it, and the free workers ---------- */

/* ---------- the frame ---------- */
let scale = 1, H = 760, hA = 272, stageX = 0, stageY = 0;
const pt = (e) => ({ x: (e.clientX - stageX) / scale, y: (e.clientY - stageY) / scale });

    e.preventDefault(); try { elm.setPointerCapture(e.pointerId); } catch (x) { /* fine */ }
    const s = pt(e); let moved = false, dead = false;
    const mv = (ev) => { const p = pt(ev); if (!moved && Math.hypot(p.x - s.x, p.y - s.y) > 8) { moved = true; if (o.start && o.start(p) === false) dead = true; } if (moved && !dead) o.move(p, p.x - s.x, p.y - s.y); };
    const up = (ev) => { elm.removeEventListener("pointermove", mv); elm.removeEventListener("pointerup", up); elm.removeEventListener("pointercancel", up); if (moved && !dead) o.drop(pt(ev)); else if (ev.type === "pointerup") o.tap(pt(ev)); };

  });
}
function floatText(t, x, y) { const f = el("div", "float", $("#stage"), t); f.style.left = x + "px"; f.style.top = y + "px"; setTimeout(() => f.remove(), 800); }

}
function go(i) { if (!avail(i)) i = 0; S.place = i; PLACES.forEach((p, n) => { $("#p-" + p).style.transform = `translateX(${(n - i) * 100}%)`; }); document.querySelectorAll("#tabs button").forEach((b, n) => b.classList.toggle("on", n === i)); save(); }
const BG = {}, CTX = {};

function swipes() {

}
function frame() {

}
function ui() {

  if (h) { const st = S.b[h.id], need = h.steps[st.step]; o.querySelector(".name").textContent = h.n; o.querySelector(".step").textContent = STEPN[st.step] + (st.on ? " · delivering" : st.held ? " · on hold" : " · not ordered"); o.querySelectorAll(".pips i").forEach((p, i) => { p.className = i < st.step ? "done" : i === st.step ? "now" : ""; }); o.querySelector(".l2").innerHTML = "Requires " + Object.keys(need).map((g) => `<b>${GC[g]}</b> <span class="num">${fmt(st.given[g] || 0)} of ${fmt(need[g])}</span>`).join(" &nbsp; "); }
  else { o.querySelector(".name").textContent = "Phase 1 complete"; o.querySelector(".step").textContent = ""; o.querySelectorAll(".pips i").forEach((p) => { p.className = "done"; }); o.querySelector(".l2").textContent = "The road to Mars goes on."; }
  for (const g of ["stones", "bricks", "cut"]) { const p = $("#pile-" + g); p.querySelector(".v").textContent = fmt(S[g]); p.querySelector(".of").textContent = F.full[g] ? "full" : isFinite(F.cap[g]) && !S.shaft ? "of " + fmt(F.cap[g]) : ""; p.querySelector(".bar i").style.width = Math.min(100, (100 * S[g]) / F.cap[g]) + "%"; p.classList.toggle("full", F.full[g]); }

  const a = actions(), n = $("#next"); n.classList.toggle("go", a.length > 0);

  n.querySelector(".k").textContent = po ? "Next · " + PLACE_N[PLACES[po.p]] : a.length ? "Affordable now" : "Next";
  n.querySelector(".t").textContent = po ? po.t : a.length ? per.map(([t, c]) => t + " " + c).join(" · ") : "Nothing affordable yet. Production is running."; n.querySelector(".n b").textContent = a.length;

  mineUI(F); if (worksOpen()) worksUI(F); if (S.shaft) shopUI(); villageUI(); wfUI();
}
let last = 0, uiT = 0, saveT = 0;
function loop(ms) {
  const t = ms / 1000, dt = Math.min(0.25, t - last || 0); last = t;
  if ($("#card").hidden || $("#card .wf")) { const L = { sent: {}, ev: [] }, r = tick(dt, 1, 1, L); HAUL = r.rate; events(L.ev); }
  const F = flows(), p = PLACES[S.place], c = CTX[p]; c.drawImage(BG[p], 0, 0);
  if (p === "mine") mineDraw(c, hA, t, F); else if (p === "works") worksDraw(c, hA, t, F); else if (p === "workshop") shopDraw(c, hA, t); else villageDraw(c, hA, t);

async function boot() {

  ICO = icons(); frame(); build(); swipes();

  let rz = 0; addEventListener("resize", () => { clearTimeout(rz); rz = setTimeout(build, 120); });
  addEventListener("visibilitychange", () => { if (document.hidden) return save(); if ($("#card .wf")) $("#card").hidden = true; const gap = S.seen ? (Date.now() - S.seen) / 1000 : 0; if (S.intro && gap > 90 && $("#card").hidden) away(gap); }); addEventListener("pagehide", save);
  if (S.intro && GONE > 90) away(GONE);
  if (!S.intro) card("The first evening", ["One level, one material, two sites: the mine and the city. You start with twelve workers: nine in the mine, one driving the horse wagon, two building.", "The workers are one workforce, and every job takes them. Hire a worker at the top right, on any site, then put the worker on a job with +, or take one off with −. A machine or a wagon stands until workers run it. Watch the sites: rock piles up where it waits, and workers stand where there is nothing to do. The balance is yours to work out.", "Order the tower in the city. Transport moves the stone to the site, the builders build it in, and the tower rises. Each finished building opens the next site. The numbers are made up and run fast. Reset, top right, can also jump to all four sites."], "Start", null, () => { S.intro = true; save(); });
  requestAnimationFrame(loop);
}
boot();
